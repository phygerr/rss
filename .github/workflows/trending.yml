name: Generate GitHub Trending RSS

on:
  schedule:
    # 每天北京时间早上 8: 点自动运行一次
    - cron: '0,30 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install feedgen requests beautifulsoup4

      - name: Run script to generate RSS
        run: |
          python generate_rss.py

      - name: Commit and push RSS
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add rss.xml
          git commit -m "Update GitHub Trending RSS" || exit 0
          git push origin main
